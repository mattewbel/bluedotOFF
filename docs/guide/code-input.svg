<svg xmlns="http://www.w3.org/2000/svg" width="360" height="217" viewBox="0 0 360 217" role="img" aria-labelledby="title description">
<title id="title">알림에 코드 입력</title>
<desc id="description">설정 화면을 유지한 채 bluedotOFF 알림에서 코드를 입력하고 전송하세요.</desc>
<rect width="360" height="217" rx="20" fill="#f3f5f9"/>
<g font-family="sans-serif" fill="#1e2431">
<text x="20" y="32" font-size="17">알림창</text>
<rect x="14" y="48" width="332" height="123" rx="12" fill="#ffffff"/>
<text x="26" y="78" font-size="14">bluedotOFF · 페어링 코드를 입력하세요</text>
<rect x="14" y="105" width="332" height="52" rx="12" fill="#ffffff" stroke="#356aff" stroke-width="2"/>
<text x="26" y="131.0" font-size="14" dominant-baseline="central">••••••</text>
<text x="306" y="131.0" font-size="14" dominant-baseline="central">→</text>
<text x="20" y="205" font-size="11" fill="#555555">이동한 화면 예시 · 강조된 곳을 누르세요</text>
</g></svg>