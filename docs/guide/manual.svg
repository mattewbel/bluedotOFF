<svg xmlns="http://www.w3.org/2000/svg" width="360" height="330" viewBox="0 0 360 330" role="img" aria-labelledby="title description">
<title id="title">분할 화면에서 입력</title>
<desc id="description">분할 화면에서 설정과 bluedotOFF를 함께 열어 코드를 입력하세요. 코드 창을 닫으면 연결할 수 없어요.</desc>
<rect width="360" height="330" rx="20" fill="#f3f5f9"/>
<g font-family="sans-serif" fill="#1e2431">
<text x="20" y="30" font-size="16">분할 화면</text>
<rect x="14" y="46" width="332" height="106" rx="12" fill="#ffffff"/>
<text x="26" y="74" font-size="14">설정 · Wi-Fi 페어링 코드</text>
<text x="180" y="127" font-size="18" text-anchor="middle">••••••</text>
<text x="180" y="169" font-size="14" text-anchor="middle">—</text>
<text x="26" y="194" font-size="16">bluedotOFF</text>
<rect x="14" y="206" width="332" height="34" rx="12" fill="#ffffff" stroke="#356aff" stroke-width="2"/>
<text x="26" y="223.0" font-size="14" dominant-baseline="central">6자리 페어링 코드</text>
<rect x="14" y="250" width="332" height="34" rx="12" fill="#ffffff" stroke="#356aff" stroke-width="2"/>
<text x="26" y="267.0" font-size="14" dominant-baseline="central">이 코드로 연결</text>
<text x="20" y="318" font-size="11" fill="#555555">이동한 화면 예시 · 강조된 곳을 누르세요</text>
</g></svg>