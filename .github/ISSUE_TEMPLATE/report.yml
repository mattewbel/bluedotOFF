name: 문제 신고 / Report a problem
description: 기기에서 동작하지 않거나 이상한 점을 알려주세요. / Tell us what did not work on your device.
body:
  - type: textarea
    id: diagnostics
    attributes:
      label: 진단 정보 / Diagnostic info
      description: 앱의 설정 → 정보 및 지원 → 진단 정보 복사 를 누른 뒤 붙여넣어 주세요. 설치된 앱 목록이나 위치 기록은 들어 있지 않아요. / In the app, tap Settings → About & support → Copy diagnostic info and paste it here. It does not include your apps or location history.
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요? / What happened?
      description: 어떤 화면에서 무엇을 눌렀고 어떤 결과가 나왔는지 적어주세요. 화면의 안내 문구를 그대로 적어주면 좋아요. / Which screen, what you tapped and what you saw (exact messages help).
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: 관련 앱 (선택) / Affected apps (optional)
      description: 예) 카카오맵, 네이버지도 / e.g. KakaoMap, Google Maps
  - type: markdown
    attributes:
      value: 개인정보(전화번호, 계정, 위치 기록 화면 등)는 올리지 마세요. 앱이 변경을 멈춘 경우에도 앱 데이터를 지우지 마세요. / Do not post personal data. If the app stopped making changes, do not clear its data.
